<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#111827"/>
<title>客户营销总控台 V2.1</title>
<link rel="manifest" href="/manifest.json"/>
<link rel="stylesheet" href="/styles.css?v=4"/>
</head>
<body>
<div id="login" class="login hidden">
  <div class="login-card">
    <div class="brand-mark">营</div>
    <h1>客户营销总控台</h1>
    <p>V2.1 · 客户档案 / 深度访谈 / 培训陪跑 / AI助手</p>
    <p>输入访问密码</p>
    <input id="loginPassword" type="password" placeholder="密码"/>
    <button id="loginBtn" class="btn primary full">进入系统</button>
    <div id="loginError" class="error"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark small">营</div>
      <div><b>客户营销总控台</b><span>V2.1 · CRM + AI运营助手</span></div>
    </div>
    <nav id="nav">
      <button data-view="dashboard" class="active">总控台</button>
      <button data-view="customers">客户档案</button>
      <button data-view="tasks">待办任务</button>
      <button data-view="settings">设置与备份</button>
    </nav>
    <div class="sidebar-footer">
      <span id="storageStatus" class="muted tiny"></span>
      <span id="aiStatus" class="status"></span>
      <button id="logoutBtn" class="link hidden">退出</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn">☰</button>
      <div id="pageTitle" class="page-title"></div>
      <span class="spacer"></span>
      <button id="saveStatus" class="link" aria-live="polite">资料已加载</button>
      <button id="quickAdd" class="btn primary">＋ 新增客户</button>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" class="icon-btn">✕</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/app.js?v=4"></script>
</body>
</html>
